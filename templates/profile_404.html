<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找不到個人檔案頁面 - 炙彗JI器人</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/state-card.css') }}" />
</head>

<body>
  {% include '_site_shell.html' %}

  <main>
    <section class="unauth-card">
      <div class="unauth-logo is-danger">
        <svg class="is-stroke" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h2 class="unauth-title">無此個人檔案頁面</h2>
      <p class="unauth-desc">
        使用者 <b>@{{ username }}</b> 尚未建立個人主頁，或該主頁網址不存在。
      </p>
      {% if session.get('user') %}
      <a class="btn-discord-login" href="/panel"><span>前往用戶中心</span></a>
      {% else %}
      <a class="btn-discord-login" href="/support?category=profile"><span>申請我自己的個人主頁</span></a>
      {% endif %}
      <div><a class="unauth-back-link" href="/">返回首頁</a></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/site-nav.js') }}"></script>
</body>

</html>
